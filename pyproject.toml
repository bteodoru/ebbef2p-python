[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ebbef2p-python"
dynamic = ["version"]
description = "Finite element analysis of Euler-Bernoulli beams on two-parameter elastic foundations (Winkler, Pasternak, modified Vlasov)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bogdan Teodoru", email = "bteodoru@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11.3"]
keywords = [
    "finite element method", "beam on elastic foundation", "Winkler",
    "Pasternak", "Vlasov", "soil-structure interaction", "geotechnical engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/bteodoru/ebbef2p-python"
Documentation = "https://ebbef2p-python.readthedocs.io"
Issues = "https://github.com/bteodoru/ebbef2p-python/issues"
Changelog = "https://github.com/bteodoru/ebbef2p-python/blob/master/CHANGELOG.md"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5", "matplotlib>=3.8"]
lint = ["ruff>=0.6"]
docs = ["sphinx>=7"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
path = "src/ebbef2p/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ebbef2p"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs/source", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ebbef2p"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = [
    "E741",   # `l` is the element length throughout, as in the FE literature
    "RUF001", "RUF002", "RUF003",  # Greek letters in docstrings are intended
]

[tool.ruff.lint.isort]
known-first-party = ["ebbef2p"]
